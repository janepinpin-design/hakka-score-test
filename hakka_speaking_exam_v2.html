<title>模擬客語能力口說測驗</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1E4; --paper-deep: #EFE7D4; --ink: #2A2420; --ink-soft: #6B5F52;
    --indigo-1: #C9D6E3; --indigo-3: #5A7CA6; --indigo-4: #33517A; --indigo-5: #16273F;
    --clay: #A8462F; --clay-soft: #F1DDD3; --moss: #4C6B4F; --moss-soft: #DCE6D4; --gold: #B98A2E;
  }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC', sans-serif; }
  .font-display{ font-family:'Noto Serif TC', serif; }
  .card{ background:#fff; border:1px solid var(--paper-deep); border-radius:16px; box-shadow:0 10px 30px -18px rgba(22,39,63,.35); }
  .btn-primary{ background:var(--indigo-4); color:#fff; transition:background .15s ease; }
  .btn-primary:hover{ background:var(--indigo-5); }
  .btn-primary:disabled{ background:#B9B2A4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1.5px solid var(--indigo-3); color:var(--indigo-5); transition:all .15s ease; }
  .btn-ghost:hover{ background:#EEF2F7; }
  .record-btn{ background:var(--clay); box-shadow:0 8px 20px -8px rgba(168,70,47,.6); transition:all .15s ease; }
  .record-btn:hover{ background:#8f3b26; }
  .record-btn.recording{ animation:recordPulse 1.1s ease-in-out infinite; }
  .record-btn:disabled{ background:#B9B2A4; cursor:not-allowed; box-shadow:none; }
  @keyframes recordPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(168,70,47,.55);} 50%{ box-shadow:0 0 0 14px rgba(168,70,47,0);} }
  .spinner{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .fade-in{ animation:fadeIn .4s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .play-btn{ background:var(--indigo-5); color:#fff; transition:all .15s ease; }
  .play-btn:hover{ background:var(--indigo-4); }
  .play-btn:active{ transform:scale(.96); }
  .play-btn:disabled{ background:#B9B2A4; cursor:not-allowed; }
  .wave{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .wave span{ width:2.5px; background:currentColor; border-radius:2px; height:4px; opacity:.5; }
  .wave.playing span{ animation:waveBar .6s ease-in-out infinite; opacity:1; }
  .wave.playing span:nth-child(1){ animation-delay:0s; }
  .wave.playing span:nth-child(2){ animation-delay:.12s; }
  .wave.playing span:nth-child(3){ animation-delay:.24s; }
  .wave.playing span:nth-child(4){ animation-delay:.36s; }
  @keyframes waveBar{ 0%,100%{ height:4px; } 50%{ height:14px; } }
  .pending-note{ background:var(--clay-soft); color:var(--clay); border-radius:10px; padding:10px 14px; font-size:12.5px; text-align:center; }
  .sub-card{ border:1px solid var(--paper-deep); border-radius:14px; padding:16px; margin-bottom:14px; background:#fff; }
</style>
</head>

// 呼叫評分 API：與正式網站（janepinpin-design 帳號、hakka-score-test 專案）同一個
// Vercel 專案下的 /api/assess-segment，走 multipart/form-data，相對路徑呼叫、同源不會有 CORS 問題。
const SCORING_API_PATH = '/api/assess-segment';

// ==================== 狀態 ====================
const state = {
  screen: 'intro',   // intro | question | result
  pos: 0,
  log: [],           // 每一題（或每一小題）的作答結果
  submitting: false,
  subPos: 0,          // multi 題型：目前在第幾小題
  subResults: [],     // multi 題型：暫存各小題分數
};

// ==================== 錄音／上傳 ====================
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlobUrl = null;
let recordedWavBlob = null;
let recordingStatus = 'idle'; // idle | recording | processing | recorded | unsupported | error
let micErrorMsg = null;
let recordSeconds = 0;
let recordTimerHandle = null;

function mediaSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function micStreamIsLive(){
  return !!(mediaStream && mediaStream.getTracks().some(t => t.readyState === 'live'));
}
function releaseMicStream(){
  if (mediaStream){ try{ mediaStream.getTracks().forEach(t => t.stop()); }catch(e){} mediaStream = null; }
}
function resetRecording(){
  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  if (mediaRecorder && mediaRecorder.state === 'recording'){ try{ mediaRecorder.stop(); }catch(e){} }
  mediaRecorder = null;
  recordedChunks = [];
  if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} recordedBlobUrl = null; }
  recordedWavBlob = null;
  recordingStatus = mediaSupported() ? 'idle' : 'unsupported';
  micErrorMsg = null;
  recordSeconds = 0;
}
function updateTimerText(){
  const el = document.getElementById('record-timer-text');
  if (el) el.textContent = `錄音中…${recordSeconds} 秒（點擊停止錄音）`;
  else render();
}
function beginRecordingWithStream(stream){
  recordedChunks = [];
  try{ mediaRecorder = new MediaRecorder(stream); }
  catch(e){ micErrorMsg = '無法啟動錄音器：' + (e && e.message ? e.message : String(e)); recordingStatus = 'error'; render(); return; }
  mediaRecorder.addEventListener('dataavailable', e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); });
  mediaRecorder.addEventListener('stop', async () => {
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
    let blob;
    try{
      blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (recordedBlobUrl){ URL.revokeObjectURL(recordedBlobUrl); }
      recordedBlobUrl = URL.createObjectURL(blob);
    }catch(e){ micErrorMsg = '錄音處理失敗：' + (e && e.message ? e.message : String(e)); recordingStatus = 'error'; render(); return; }
    recordingStatus = 'processing'; render();
    try{ recordedWavBlob = await convertBlobTo16kMonoWav(blob); recordingStatus = 'recorded'; }
    catch(e){ console.warn('音檔轉換失敗：', e); recordedWavBlob = null; recordingStatus = 'error'; micErrorMsg = '音檔轉換失敗：' + (e && e.message ? e.message : String(e)); }
    render();
  });
  mediaRecorder.start();
  recordingStatus = 'recording';
  recordSeconds = 0;
  recordTimerHandle = setInterval(() => { recordSeconds += 1; updateTimerText(); }, 1000);
  render();
}
function startRecording(){
  if (!mediaSupported()){ recordingStatus = 'unsupported'; render(); return; }
  if (micStreamIsLive()){ beginRecordingWithStream(mediaStream); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaStream = stream;
    beginRecordingWithStream(stream);
  }).catch(err => {
    micErrorMsg = (err && err.message) ? err.message : '無法取得麥克風權限';
    recordingStatus = 'error';
    render();
  });
}
function stopRecording(){ if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }
function playPreview(){ if (!recordedBlobUrl) return; const a = new Audio(recordedBlobUrl); a.play().catch(()=>{}); }

function playDataUriAudio(dataUri, waveElId){
  const wave = waveElId ? document.getElementById(waveElId) : null;
  const showWave = (on) => { if (wave) wave.classList.toggle('playing', on); };
  try{
    const audio = new Audio(dataUri);
    audio.addEventListener('playing', () => showWave(true));
    audio.addEventListener('ended', () => showWave(false));
    audio.addEventListener('error', () => { showWave(false); console.warn('題目語音播放失敗'); });
    audio.play().catch(() => showWave(false));
  }catch(e){
    console.warn('題目語音播放失敗：', e);
  }
}
function retryRecording(){
  if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} recordedBlobUrl = null; }
  recordedChunks = []; recordedWavBlob = null;
  recordingStatus = 'idle'; micErrorMsg = null; recordSeconds = 0;
  render();
}
async function handleFileUpload(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (mediaRecorder && mediaRecorder.state === 'recording'){ try{ mediaRecorder.stop(); }catch(e){} }
  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  if (recordedBlobUrl){ try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){} recordedBlobUrl = null; }
  recordedWavBlob = null;
  recordingStatus = 'processing'; micErrorMsg = null; render();
  try{
    recordedBlobUrl = URL.createObjectURL(file);
    recordedWavBlob = await convertBlobTo16kMonoWav(file);
    recordingStatus = 'recorded';
  }catch(e){
    console.warn('上傳音檔轉換失敗：', e);
    micErrorMsg = '上傳的音檔無法解析／轉換：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
  }
  inputEl.value = '';
  render();
}

// ==================== WAV 轉檔（Mono / 16kHz / 16bit PCM，符合評分 API 規格） ====================
function encodeWav16kMono(audioBuffer){
  const channelData = audioBuffer.getChannelData(0);
  const numSamples = channelData.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2, blockAlign = bytesPerSample, byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  function writeString(o, s){ for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); }
  writeString(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeString(8,'WAVE');
  writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,byteRate,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
  writeString(36,'data'); view.setUint32(40,dataSize,true);
  let offset=44;
  for (let i=0;i<numSamples;i++, offset+=2){
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  return new Blob([buffer], { type:'audio/wav' });
}
async function convertBlobTo16kMonoWav(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try{ decoded = await tempCtx.decodeAudioData(arrayBuffer); } finally { try{ tempCtx.close(); }catch(e){} }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(offlineCtx.destination);
  src.start(0);
  const rendered = await offlineCtx.startRendering();
  return encodeWav16kMono(rendered);
}

// ==================== 呼叫評分 API（multipart/form-data，同源相對路徑） ====================
async function callScoringApi(wavBlob, pinyin, text, accentId){
  const formData = new FormData();
  formData.append('file', wavBlob, 'recording.wav');
  formData.append('pinyin', pinyin || '');
  formData.append('text', text || '');
  formData.append('accent_id', accentId || '1');

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 90000);
  try{
    const resp = await fetch(SCORING_API_PATH, { method:'POST', body: formData, signal: controller.signal });
    clearTimeout(timeoutId);
    let body = null;
    try{ body = await resp.json(); }catch(e){}
    if (!resp.ok){ console.warn(`評分 API 失敗（HTTP ${resp.status}）：`, body); return null; }
    if (!body || typeof body.score !== 'number'){ console.warn('評分 API 回傳格式異常：', body); return null; }
    return body;
  }catch(e){
    clearTimeout(timeoutId);
    console.warn('評分 API 呼叫失敗：', e);
    return null;
  }
}

// ==================== 作答流程 ====================
function startExam(){
  state.screen = 'question';
  state.pos = 0;
  state.log = [];
  state.subPos = 0;
  state.subResults = [];
  resetRecording();
  render();
}

function goNextQuestion(){
  state.pos += 1;
  state.subPos = 0;
  state.subResults = [];
  resetRecording();
  if (state.pos >= questions.length){
    releaseMicStream();
    state.screen = 'result';
  }
  render();
}

// 開放式問題（不錄音、不評分）：直接標記後前進
function continueOpenQuestion(){
  const q = questions[state.pos];
  state.log.push({ level:q.level, type:q.type, question:q.questionText, unscored:true });
  goNextQuestion();
}

// single／combined：單段錄音送出評分
async function submitSingleAnswer(){
  const q = questions[state.pos];
  if (!recordedWavBlob) return;
  state.submitting = true; render();

  const result = await callScoringApi(recordedWavBlob, q.pinyin, q.target || q.questionText, q.accentId);
  let score, simulated;
  if (result && typeof result.score === 'number'){ score = Math.round(result.score); simulated = false; }
  else { score = Math.round(60 + Math.random() * 40); simulated = true; }

  state.log.push({ level:q.level, type:q.type, question:q.questionText || (q.audioPrompt ? q.audioPrompt.filename : ''), target:q.target, score, simulated });
  state.submitting = false;
  goNextQuestion();
}

// multi：每一小題各自送出評分
async function submitSubAnswer(){
  const q = questions[state.pos];
  const sub = q.subItems[state.subPos];
  if (!recordedWavBlob) return;
  state.submitting = true; render();

  const result = await callScoringApi(recordedWavBlob, sub.pinyin, sub.target, q.accentId);
  let score, simulated;
  if (result && typeof result.score === 'number'){ score = Math.round(result.score); simulated = false; }
  else { score = Math.round(60 + Math.random() * 40); simulated = true; }

  state.subResults.push({ label:sub.label, target:sub.target, score, simulated });
  state.submitting = false;
  state.subPos += 1;
  resetRecording();

  if (state.subPos >= q.subItems.length){
    state.log.push({ level:q.level, type:q.type, question:q.subItems.map(s=>s.target).join('／'), subResults: state.subResults, multi:true });
    goNextQuestion();
  } else {
    render();
  }
}

function restartExam(){
  releaseMicStream();
  resetRecording();
  state.screen = 'intro';
  state.pos = 0;
  state.log = [];
  state.subPos = 0;
  state.subResults = [];
  render();
}

// ==================== 畫面 ====================
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
function scoreColor(score){
  if (score >= 80) return 'var(--moss)';
  if (score >= 60) return 'var(--gold)';
  return 'var(--clay)';
}

function renderIntro(){
  const scoredCount = questions.filter(q=>q.scored).length;

function renderSingleQuestion(q, seq, total){

function renderQuestion(){

function renderResult(){

    else { scoredItems.push(item.score); }
  });
  const avg = scoredItems.length ? Math.round(scoredItems.reduce((s,x)=>s+x,0) / scoredItems.length) : null;
  const anySimulated = state.log.some(x=>x.simulated || (x.subResults && x.subResults.some(r=>r.simulated)));
  return `
  <div class="flex-1 px-5 py-10 fade-in">

        <p class="text-[13px] mt-3" style="color:var(--ink-soft);">
          共 ${questions.length} 題，其中 ${scoredItems.length} 個評分項目．平均分數 ${avg !== null ? avg + '／100' : '—'}${anySimulated ? '（部分為模擬結果，詳見各題標示）' : ''}
        </p>
      </div>
      ${state.log.map(renderResultItem).join('')}
      <div class="flex justify-center mt-6">
        <button onclick="restartExam()" class="btn-ghost rounded-full px-8 py-3 font-medium text-[14px]">重新開始測驗</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if (state.screen === 'intro') html = renderIntro();
  else if (state.screen === 'question') html = renderQuestion();
  else if (state.screen === 'result') html = renderResult();
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
